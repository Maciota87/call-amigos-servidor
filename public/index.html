<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Morro do Bingão</title>
  <style>
    :root {
      --roxo: #7c3aed;
      --roxo-escuro: #1a0b2e;
      --lilas: #c4b5fd;
      --lilas-claro: #a78bfa;
      --vermelho: #e0313b;
      --branco: #faf5ff;
      --cinza: #2e1f4a;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--branco);
      background: radial-gradient(circle at top, #4c1d95 0%, var(--roxo-escuro) 60%, #0a0414 100%);
      background-attachment: fixed;
    }

    header {
      text-align: center;
      padding: 24px 16px 10px;
      animation: descer .6s ease;
    }
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }
    .logo-img {
      width: 110px;
      height: auto;
      border-radius: 16px;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,.4));
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3.2rem);
      letter-spacing: 1px;
      text-shadow: 0 4px 0 rgba(0,0,0,.35);
    }
    .sub { margin: 6px 0 0; opacity: .8; font-size: 1rem; }

    .card {
      max-width: 420px;
      margin: 28px auto;
      padding: 28px;
      background: var(--cinza);
      border-radius: 20px;
      box-shadow: 0 12px 30px rgba(0,0,0,.35);
      display: flex;
      flex-direction: column;
      gap: 14px;
      animation: subir .5s ease;
    }
    .card label { font-size: .9rem; opacity: .85; }

    input {
      padding: 12px 14px;
      border-radius: 12px;
      border: 2px solid transparent;
      background: #180d2b;
      color: var(--branco);
      font-size: 1rem;
      outline: none;
      transition: border-color .2s;
    }
    input:focus { border-color: var(--lilas-claro); }

    .btn {
      padding: 12px 18px;
      border: none;
      border-radius: 12px;
      background: #4a3a63;
      color: var(--branco);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform .15s, filter .2s, background .2s;
    }
    .btn:hover { filter: brightness(1.12); transform: translateY(-2px); }
    .btn:active { transform: translateY(1px); }
    .btn.primary { background: var(--roxo); }
    .btn.destaque { background: var(--lilas); color: #1a0b2e; }
    .btn.danger { background: var(--vermelho); }
    .btn.big { padding: 15px; font-size: 1.1rem; }
    .btn.ativo { background: var(--lilas); color: #1a0b2e; }

    #call {
      padding: 0 14px 20px;
      animation: subir .4s ease;
    }
    #grid {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      align-items: center;
      min-height: 60vh;
    }
    .tile {
      position: relative;
      flex: 0 0 230px;
      aspect-ratio: 16 / 9;
      background: #0a0414;
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      border: 3px solid transparent;
      box-shadow: 0 6px 18px rgba(0,0,0,.4);
      transition: flex .35s ease, height .35s ease, border-color .25s;
      animation: entrar .4s ease;
    }
    .tile:hover { border-color: rgba(167,139,250,.6); }
    .tile.focus {
      flex: 1 1 100%;
      aspect-ratio: auto;
      height: 62vh;
      border-color: var(--lilas-claro);
    }
    .tile video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #0a0414;
    }
    .tile .avatar {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: 800;
      color: var(--lilas);
      background: linear-gradient(135deg, #7c3aed, #3b0764);
    }
    .tile.sem-video .avatar { display: flex; }
    .tile.sem-video video { visibility: hidden; }
    .tile .nome {
      position: absolute;
      left: 10px;
      bottom: 10px;
      background: rgba(0,0,0,.65);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: .9rem;
    }
    .tile .tag-tela {
      position: absolute;
      top: 10px;
      right: 10px;
      background: var(--vermelho);
      padding: 3px 9px;
      border-radius: 8px;
      font-size: .75rem;
      font-weight: 700;
      display: none;
    }
    .tile.compartilhando .tag-tela { display: block; }

    #controls {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
      padding: 14px;
      background: rgba(0,0,0,.35);
      border-radius: 18px;
      position: sticky;
      bottom: 12px;
    }
    .dica { text-align: center; opacity: .6; font-size: .9rem; margin: 14px 0 0; }

    @keyframes descer { from { opacity: 0; transform: translateY(-14px); } to { opacity: 1; transform: none; } }
    @keyframes subir { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes entrar { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: scale(1); } }

    @media (max-width: 600px) {
      .tile { flex: 0 0 150px; }
      .tile.focus { height: 45vh; }
      .logo-img { width: 70px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <img src="mdb.png" alt="Logo MDB" class="logo-img">
      <h1>Morro do Bingão</h1>
    </div>
      <svg viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg" aria-label="Logo MDB">
        <defs>
          <linearGradient id="morro" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#c4b5fd"/>
            <stop offset="1" stop-color="#5b21b6"/>
          </linearGradient>
        </defs>
        <path d="M0 120 Q60 20 110 40 Q160 55 200 120 Z" fill="url(#morro)"/>
        <text x="100" y="95" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="34" font-weight="900" fill="#ffffff">MDB</text>
      </svg>
      <h1>Morro do Bingão</h1>
    </div>
    <p class="sub">Chamada com amigos e compartilhamento de tela</p>
  </header>

  <section id="setup" class="card">
    <label for="room">Nome da sala</label>
    <input id="room" placeholder="ex: bingo-da-galera">
    <label for="name">Seu nome</label>
    <input id="name" placeholder="ex: Maria">
    <button class="btn primary big" onclick="join()">Entrar na sala</button>
  </section>

  <section id="call" hidden>
    <div id="grid"></div>

    <nav id="controls">
      <button id="micBtn" class="btn" onclick="toggleMic(this)">🎤 Desligar microfone</button>
      <button id="shareBtn" class="btn destaque" onclick="toggleShare()">🖥️ Compartilhar tela</button>
      <button id="fullBtn" class="btn" onclick="toggleFull()">⛶ Tela cheia</button>
      <button class="btn danger" onclick="location.reload()">📞 Sair da chamada</button>
    </nav>

    <p class="dica">Clique em um vídeo para colocá-lo em destaque.</p>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const ICE = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
    const peers = new Map();
    let micTrack = null;
    let screenTrack = null;
    let meVideo = null;

    // Qualidade alvo para a tela compartilhada: 60 fps, priorizando fluidez
    const FPS_ALVO = 60;
    const BITRATE_MAX = 6000000; // 6 Mbps

    const $ = (id) => document.getElementById(id);

    function addTile(id, name, muted = false) {
      const div = document.createElement('div');
      div.className = 'tile sem-video';
      div.id = 'tile-' + id;
      div.innerHTML = `
        <video autoplay playsinline ${muted ? 'muted' : ''}></video>
        <div class="avatar">${name.trim().charAt(0).toUpperCase()}</div>
        <span class="tag-tela">AO VIVO</span>
        <span class="nome"></span>`;
      div.querySelector('.nome').textContent = name;
      div.onclick = () => focarTile(div);
      $('grid').appendChild(div);

      if (!document.querySelector('.tile.focus')) focarTile(div);

      const video = div.querySelector('video');
      video.play().catch(() => {});
      return video;
    }

    function focarTile(div) {
      document.querySelectorAll('.tile.focus').forEach((t) => t.classList.remove('focus'));
      div.classList.add('focus');
    }

    function marcarComVideo(id, temVideo) {
      const div = $('tile-' + id);
      if (div) div.classList.toggle('sem-video', !temVideo);
    }

    // Pede ao navegador para enviar a tela com a maior taxa de quadros possível
    function ajustarQualidade(sender) {
      if (!sender || !sender.track || sender.track.kind !== 'video') return;
      try {
        const params = sender.getParameters();
        if (!params.encodings || params.encodings.length === 0) params.encodings = [{}];
        params.encodings[0].maxBitrate = BITRATE_MAX;
        params.encodings[0].maxFramerate = FPS_ALVO;
        params.degradationPreference = 'maintain-framerate';
        sender.setParameters(params).catch(() => {});
      } catch (e) {
        // Alguns navegadores só aceitam isso depois da negociação; tudo bem ignorar
      }
    }

    async function join() {
      const room = $('room').value.trim();
      const name = $('name').value.trim();
      if (!room || !name) return alert('Preencha o nome da sala e o seu nome.');

      try {
        const mic = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        micTrack = mic.getAudioTracks()[0];
      } catch {
        alert('Não consegui acessar o microfone. Você vai ouvir, mas não vai conseguir falar.');
      }

      $('setup').hidden = true;
      $('call').hidden = false;
      meVideo = addTile('me', name + ' (você)', true);

      socket.emit('join-room', room, name);
    }

    function createPC(id, name = 'Amigo') {
      if (peers.has(id)) return peers.get(id);

      const pc = new RTCPeerConnection(ICE);
      const remote = new MediaStream();

      const audioSender = pc.addTransceiver('audio', { direction: 'sendrecv' }).sender;
      const videoSender = pc.addTransceiver('video', { direction: 'sendrecv' }).sender;

      const peer = {
        pc, audioSender, videoSender,
        polite: socket.id < id,
        makingOffer: false,
        ignoreOffer: false,
      };
      peers.set(id, peer);

      if (micTrack) audioSender.replaceTrack(micTrack);
      if (screenTrack) {
        videoSender.replaceTrack(screenTrack);
        ajustarQualidade(videoSender);
      }

      const video = addTile(id, name);
      video.srcObject = remote;

      pc.ontrack = ({ track }) => {
        remote.addTrack(track);
        if (track.kind === 'video') marcarComVideo(id, true);
        track.onmute = () => marcarComVideo(id, false);
        track.onunmute = () => marcarComVideo(id, true);
        // Garante que o áudio e o vídeo recebidos comecem a tocar
        document.querySelectorAll('video').forEach((v) => v.play().catch(() => {}));
      };

      pc.onnegotiationneeded = async () => {
        try {
          peer.makingOffer = true;
          await pc.setLocalDescription();
          socket.emit('signal', { to: id, data: { description: pc.localDescription } });
          ajustarQualidade(videoSender);
        } catch (e) {
          console.error(e);
        } finally {
          peer.makingOffer = false;
        }
      };

      pc.onicecandidate = ({ candidate }) => {
        if (candidate) socket.emit('signal', { to: id, data: { candidate } });
      };

      pc.onconnectionstatechange = () => {
        if (pc.connectionState === 'failed') pc.restartIce();
      };

      return peer;
    }

    async function onSignal({ from, data }) {
      const peer = peers.get(from) || createPC(from);
      const pc = peer.pc;
      const { description, candidate } = data;

      if (description) {
        const offerCollision =
          description.type === 'offer' && (peer.makingOffer || pc.signalingState !== 'stable');
        peer.ignoreOffer = !peer.polite && offerCollision;
        if (peer.ignoreOffer) return;

        await pc.setRemoteDescription(description);
        if (description.type === 'offer') {
          await pc.setLocalDescription();
          socket.emit('signal', { to: from, data: { description: pc.localDescription } });
          ajustarQualidade(peer.videoSender);
        }
      } else if (candidate) {
        try {
          await pc.addIceCandidate(candidate);
        } catch (e) {
          if (!peer.ignoreOffer) console.error(e);
        }
      }
    }

    socket.on('existing-users', (users) => users.forEach((u) => createPC(u.id, u.name)));
    socket.on('user-joined', ({ id, name }) => createPC(id, name));
    socket.on('signal', onSignal);

    socket.on('user-left', (id) => {
      const peer = peers.get(id);
      if (!peer) return;
      peer.pc.close();
      peers.delete(id);
      $('tile-' + id)?.remove();
    });

    async function toggleShare() {
      if (screenTrack) return stopShare();

      try {
        const stream = await navigator.mediaDevices.getDisplayMedia({
          video: {
            frameRate: { ideal: FPS_ALVO, max: FPS_ALVO },
          },
          audio: false,
        });

        screenTrack = stream.getVideoTracks()[0];
        // "motion" diz ao navegador para priorizar movimento (fluidez) em vez de nitidez parada
        screenTrack.contentHint = 'motion';
        screenTrack.onended = stopShare;

        meVideo.srcObject = new MediaStream([screenTrack]);
        marcarComVideo('me', true);
        $('tile-me').classList.add('compartilhando');
        focarTile($('tile-me'));

        peers.forEach((p) => {
          p.videoSender.replaceTrack(screenTrack);
          ajustarQualidade(p.videoSender);
        });

        $('shareBtn').textContent = '⏹️ Parar de compartilhar';
        $('shareBtn').classList.add('ativo');
      } catch (e) {
        console.log('Compartilhamento cancelado:', e);
      }
    }

    function stopShare() {
      if (!screenTrack) return;
      screenTrack.stop();
      screenTrack = null;
      meVideo.srcObject = null;
      marcarComVideo('me', false);
      $('tile-me').classList.remove('compartilhando');
      peers.forEach((p) => p.videoSender.replaceTrack(null));

      $('shareBtn').textContent = '🖥️ Compartilhar tela';
      $('shareBtn').classList.remove('ativo');
    }

    function toggleMic(btn) {
      if (!micTrack) return;
      micTrack.enabled = !micTrack.enabled;
      btn.textContent = micTrack.enabled ? '🎤 Desligar microfone' : '🔇 Ligar microfone';
      btn.classList.toggle('ativo', !micTrack.enabled);
    }

    function toggleFull() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {
          alert('Seu navegador não permitiu a tela cheia.');
        });
      } else {
        document.exitFullscreen();
      }
    }

    document.addEventListener('fullscreenchange', () => {
      const botao = $('fullBtn');
      const cheia = !!document.fullscreenElement;
      botao.textContent = cheia ? '🔲 Sair da tela cheia' : '⛶ Tela cheia';
      botao.classList.toggle('ativo', cheia);
    });
  </script>
</body>
</html>
