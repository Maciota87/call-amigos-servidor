<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Morro do Bingão</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #1e1f22; color: #eee; min-height: 100vh; }
    header { padding: 12px 16px; background: #2b2d31; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    input { padding: 8px 10px; border-radius: 6px; border: none; background: #1e1f22; color: #eee; font-size: 14px; }
    button { padding: 8px 14px; border: none; border-radius: 6px; background: #5865f2; color: #fff; cursor: pointer; font-size: 14px; }
    button:hover { filter: brightness(1.1); }
    button.red { background: #da373c; }
    button.gray { background: #4e5058; }
    #grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 10px; padding: 10px; }
    .tile { position: relative; background: #000; border-radius: 10px; overflow: hidden; aspect-ratio: 16 / 9; }
    .tile video { width: 100%; height: 100%; object-fit: contain; }
    .tile span { position: absolute; left: 8px; bottom: 8px; background: rgba(0,0,0,.6); padding: 3px 8px; border-radius: 4px; font-size: 14px; }
    #controls { display: none; gap: 8px; }
  </style>
</head>
<body>
  <header>
    <div id="setup" style="display:flex;gap:8px;flex-wrap:wrap;">
      <input id="room" placeholder="Nome da sala (ex: amigos123)">
      <input id="name" placeholder="Seu nome">
      <button onclick="join()">Entrar</button>
    </div>
    <div id="controls">
      <button id="shareBtn" onclick="toggleShare()">Compartilhar tela</button>
      <button id="micBtn" class="gray" onclick="toggleMic(this)">Mutar</button>
      <button class="red" onclick="location.reload()">Sair</button>
    </div>
  </header>

  <div id="grid"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const ICE = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
    const peers = new Map();
    let micTrack = null;
    let screenTrack = null;
    let meVideo = null;

    const $ = (id) => document.getElementById(id);

    function addTile(id, name, muted = false) {
      const div = document.createElement('div');
      div.className = 'tile';
      div.id = 'tile-' + id;
      div.innerHTML = `<video autoplay playsinline ${muted ? 'muted' : ''}></video><span></span>`;
      div.querySelector('span').textContent = name;
      $('grid').appendChild(div);
      return div.querySelector('video');
    }

    async function join() {
      const room = $('room').value.trim();
      const name = $('name').value.trim();
      if (!room || !name) return alert('Preencha a sala e seu nome.');

      try {
        const mic = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        micTrack = mic.getAudioTracks()[0];
      } catch {
        alert('Não consegui acessar o microfone. Você poderá assistir, mas não falar.');
      }

      $('setup').style.display = 'none';
      $('controls').style.display = 'flex';
      meVideo = addTile('me', name + ' (você)', true);

      socket.emit('join-room', room, name);
    }

    function createPC(id, name = 'Amigo') {
      if (peers.has(id)) return peers.get(id);

      const pc = new RTCPeerConnection(ICE);
      const remote = new MediaStream();

      const audioSender = pc.addTransceiver('audio', { direction: 'sendrecv' }).sender;
      const videoSender = pc.addTransceiver('video', { direction: 'sendrecv' }).sender;

      const peer = {
        pc, audioSender, videoSender,
        polite: socket.id < id,
        makingOffer: false,
        ignoreOffer: false,
      };
      peers.set(id, peer);

      if (micTrack) audioSender.replaceTrack(micTrack);
      if (screenTrack) videoSender.replaceTrack(screenTrack);

      const video = addTile(id, name);
      video.srcObject = remote;

      pc.ontrack = ({ track }) => remote.addTrack(track);

      pc.onnegotiationneeded = async () => {
        try {
          peer.makingOffer = true;
          await pc.setLocalDescription();
          socket.emit('signal', { to: id, data: { description: pc.localDescription } });
        } catch (e) {
          console.error(e);
        } finally {
          peer.makingOffer = false;
        }
      };

      pc.onicecandidate = ({ candidate }) => {
        if (candidate) socket.emit('signal', { to: id, data: { candidate } });
      };

      pc.onconnectionstatechange = () => {
        if (pc.connectionState === 'failed') pc.restartIce();
      };

      return peer;
    }

    async function onSignal({ from, data }) {
      const peer = peers.get(from) || createPC(from);
      const pc = peer.pc;
      const { description, candidate } = data;

      if (description) {
        const offerCollision =
          description.type === 'offer' && (peer.makingOffer || pc.signalingState !== 'stable');
        peer.ignoreOffer = !peer.polite && offerCollision;
        if (peer.ignoreOffer) return;

        await pc.setRemoteDescription(description);
        if (description.type === 'offer') {
          await pc.setLocalDescription();
          socket.emit('signal', { to: from, data: { description: pc.localDescription } });
        }
      } else if (candidate) {
        try {
          await pc.addIceCandidate(candidate);
        } catch (e) {
          if (!peer.ignoreOffer) console.error(e);
        }
      }
    }

    socket.on('existing-users', (users) => users.forEach((u) => createPC(u.id, u.name)));
    socket.on('user-joined', ({ id, name }) => createPC(id, name));
    socket.on('signal', onSignal);

    socket.on('user-left', (id) => {
      const peer = peers.get(id);
      if (!peer) return;
      peer.pc.close();
      peers.delete(id);
      $('tile-' + id)?.remove();
    });

    async function toggleShare() {
      if (screenTrack) return stopShare();

      try {
        const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
        screenTrack = stream.getVideoTracks()[0];
        screenTrack.onended = stopShare;

        meVideo.srcObject = new MediaStream([screenTrack]);
        peers.forEach((p) => p.videoSender.replaceTrack(screenTrack));

        $('shareBtn').textContent = 'Parar de compartilhar';
        $('shareBtn').classList.add('red');
      } catch (e) {
        console.log('Compartilhamento cancelado:', e);
      }
    }

    function stopShare() {
      if (!screenTrack) return;
      screenTrack.stop();
      screenTrack = null;
      meVideo.srcObject = null;
      peers.forEach((p) => p.videoSender.replaceTrack(null));

      $('shareBtn').textContent = 'Compartilhar tela';
      $('shareBtn').classList.remove('red');
    }

    function toggleMic(btn) {
      if (!micTrack) return;
      micTrack.enabled = !micTrack.enabled;
      btn.textContent = micTrack.enabled ? 'Mutar' : 'Desmutar';
    }
  </script>
</body>
</html>
